<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>Presensiku</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    * { box-sizing:border-box } html,body { margin:0;height:100%;font-family:system-ui,sans-serif;background:#f3f4f6 }
    header { height:56px;background:#14532d;color:white;display:flex;align-items:center;padding:0 16px;font-weight:700 }
    main { height:calc(100% - 56px) }
    iframe { width:100%;height:100%;border:0;background:white }
    .fallback { padding:16px;text-align:center }
  </style>
</head>
<body>
<header>Presensiku</header>
<main>
  <iframe src="https://sites.google.com/view/presensiku-sistem-kehadiran-ka/full-page-embed" title="Sistem Kehadiran Presensiku" allow="geolocation"></iframe>
</main>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
